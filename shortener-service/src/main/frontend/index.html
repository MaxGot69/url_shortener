<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 560px;
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: #888;
            text-align: center;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        input[type="url"] {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.2s;
            outline: none;
        }

        input[type="url"]:focus {
            border-color: #667eea;
        }

        button {
            padding: 14px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            white-space: nowrap;
        }

        button:hover:not(:disabled) {
            opacity: 0.9;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            background: #f7f8fc;
            border-radius: 12px;
            padding: 20px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .result.visible {
            display: block;
        }

        .result-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .short-link {
            display: block;
            font-size: 18px;
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
            word-break: break-all;
            margin-bottom: 16px;
            transition: color 0.2s;
        }

        .short-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .stats-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 16px;
            border-top: 1px solid #e0e0e0;
        }

        .stats-label {
            font-size: 14px;
            color: #666;
        }

        .stats-value {
            font-size: 22px;
            font-weight: 700;
            color: #333;
        }

        .stats-btn {
            padding: 8px 16px;
            font-size: 13px;
            background: #eef1ff;
            color: #667eea;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .stats-btn:hover {
            background: #dde3ff;
        }

        .error {
            background: #ffeaea;
            color: #c0392b;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-top: 16px;
            display: none;
        }

        .error.visible {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔗 URL Shortener</h1>
    <p class="subtitle">Вставь длинную ссылку и получи короткую</p>

    <form id="shortenForm" class="input-group">
        <input
                type="url"
                id="urlInput"
                placeholder="https://example.com/very/long/path"
                required
        >
        <button type="submit" id="submitBtn">Сократить</button>
    </form>

    <div class="result" id="result">
        <div class="result-label">Короткая ссылка</div>
        <a
                href="#"
                target="_blank"
                rel="noopener"
                class="short-link"
                id="shortLink"
        ></a>

        <div class="stats-row">
            <div>
                <div class="stats-label">Переходов</div>
                <div class="stats-value" id="clicksCount">—</div>
            </div>
            <button class="stats-btn" id="refreshStats">Обновить</button>
        </div>
    </div>

    <div class="error" id="error"></div>
</div>

<script>
    const API_BASE = 'http://localhost:8080';
    const form = document.getElementById('shortenForm');
    const urlInput = document.getElementById('urlInput');
    const submitBtn = document.getElementById('submitBtn');
    const result = document.getElementById('result');
    const shortLink = document.getElementById('shortLink');
    const clicksCount = document.getElementById('clicksCount');
    const refreshStats = document.getElementById('refreshStats');
    const errorBox = document.getElementById('error');

    let currentShortCode = null;

    // Создание короткой ссылки
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();

        const originalUrl = urlInput.value.trim();
        if (!originalUrl) return;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Создаём...';

        try {
            const response = await fetch(`${API_BASE}/api/links`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ originalUrl })
            });

            if (!response.ok) {
                throw new Error(`Ошибка ${response.status}: ${response.statusText}`);
            }

            const data = await response.json();
            showResult(data);
        } catch (err) {
            showError('Не удалось создать ссылку: ' + err.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Сократить';
        }
    });

    // Отображение результата
    function showResult(data) {
        currentShortCode = data.shortCode;
        shortLink.href = data.shortUrl;
        shortLink.textContent = data.shortUrl;
        clicksCount.textContent = '—';
        result.classList.add('visible');
        fetchStats();
    }

    // Загрузка статистики
    async function fetchStats() {
        if (!currentShortCode) return;

        try {
            const response = await fetch(
                `${API_BASE}/api/links/${currentShortCode}/stats`
            );

            if (!response.ok) {
                throw new Error(`Ошибка ${response.status}`);
            }

            const stats = await response.json();
            clicksCount.textContent = stats.clicks ?? 0;
        } catch (err) {
            clicksCount.textContent = '?';
            console.error('Ошибка загрузки статистики:', err);
        }
    }

    refreshStats.addEventListener('click', fetchStats);

    // Показ ошибки
    function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.add('visible');
    }

    function hideError() {
        errorBox.classList.remove('visible');
    }
</script>
</body>
</html>
